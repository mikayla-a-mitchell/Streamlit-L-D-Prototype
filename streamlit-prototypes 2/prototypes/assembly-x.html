html &gt; body {

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))

  text-decoration: none;
  text-underline-offset: 2px;

a:is(:hover, :focus-visible) {

  text-decoration-style: dashed;

h2,
h3,
h4,
h5,

}

h3,
h4,
h5,

  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {

  padding: 1px 6px;

}

.table-responsive &gt; .table :is(th, td) {

}

.table :is(th, td):last-child {

}

.table :is(caption, thead th) {

}

.table thead th {

}

}

  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;

.card {

  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {

  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;

    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)

  border-radius: var(--radius-lg);

  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);

  white-space: normal;
  pointer-events: none;
  user-select: none;

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;

  font-weight: var(--font-weight-medium);

.text-muted {

}

.sr-only {

  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;

.viz-controls {

  flex-wrap: wrap;
  align-items: center;

        button.textContent = label;
        button.addEventListener(&quot;click&quot;, handler);
        return button;
      }

      function initialItems(start) {
        if (start.kind === &quot;x&quot;) return [{ type: &quot;x&quot; }];
        return Array.from({ length: start.value }, () =&gt; ({ type: &quot;unit&quot; }));
      }

      function applyStructure(items, opId) {
        const op = operations[opId];
        if (op.kind === &quot;add&quot;) {
          return items.concat(Array.from({ length: op.value }, () =&gt; ({ type: &quot;unit&quot; })));
        }
        const snapshot = clone(items);
        return Array.from({ length: op.value }, () =&gt; ({ type: &quot;group&quot;, items: clone(snapshot) }));
      }

      function executeStructure(start, program) {
        let items = initialItems(start);
        program.forEach((opId) =&gt; {
          items = applyStructure(items, opId);
        });
        return items;
      }

      function flattenCounts(items) {
        return items.reduce(
          (total, item) =&gt; {
            if (item.type === &quot;x&quot;) total.x += 1;
            if (item.type === &quot;unit&quot;) total.units += 1;
            if (item.type === &quot;group&quot;) {
              const child = flattenCounts(item.items);
              total.x += child.x;
              total.units += child.units;
            }
            return total;
          },
          { x: 0, units: 0 }
        );
      }

      function numericValue(start, program, xValue = 0) {
        let value = start.kind === &quot;x&quot; ? xValue : start.value;
        program.forEach((opId) =&gt; {
          const op = operations[opId];
          value = op.kind === &quot;add&quot; ? value + op.value : value * op.value;
        });
        return value;
      }

      function startAst(start) {
        return start.kind === &quot;x&quot; ? { type: &quot;x&quot; } : { type: &quot;number&quot;, value: start.value };
      }

      function buildAst(start, program) {
        let ast = startAst(start);
        program.forEach((opId) =&gt; {
          const op = operations[opId];
          ast = op.kind === &quot;add&quot;
            ? { type: &quot;add&quot;, child: ast, value: op.value }
            : { type: &quot;mul&quot;, child: ast, value: op.value };
        });
        return ast;
      }

      function formatAst(ast) {
        if (ast.type === &quot;x&quot;) return &quot;x&quot;;
        if (ast.type === &quot;number&quot;) return String(ast.value);
        if (ast.type === &quot;add&quot;) return `${formatAst(ast.child)} + ${ast.value}`;
        if (ast.type === &quot;mul&quot;) {
          const child = formatAst(ast.child);
          if (ast.child.type === &quot;add&quot;) return `${ast.value}(${child})`;
          if (ast.child.type === &quot;x&quot;) return `${ast.value}x`;
          return `${ast.value} × ${child}`;
        }
        return &quot;&quot;;
      }

      function expressionFor(start, program) {
        return formatAst(buildAst(start, program));
      }

      function programsMatch(a, b) {
        return a.length === b.length &amp;&amp; a.every((value, index) =&gt; value === b[index]);
      }

      function describeInventory(items) {
        const counts = flattenCounts(items);
        const groups = items.filter((item) =&gt; item.type === &quot;group&quot;).length;
        const parts = [];
        if (groups) parts.push(`${groups} grouped tray${groups === 1 ? &quot;&quot; : &quot;s&quot;}`);
        if (counts.x) parts.push(`${counts.x} sealed x-crate${counts.x === 1 ? &quot;&quot; : &quot;s&quot;}`);
        if (counts.units) parts.push(`${counts.units} unit${counts.units === 1 ? &quot;&quot; : &quot;s&quot;}`);
        return parts.length ? parts.join(&quot;, &quot;) : &quot;an empty tray&quot;;
      }

      function createPiece(type, compact = false) {
        const piece = document.createElement(&quot;span&quot;);
        piece.className = `ax-piece ${type === &quot;x&quot; ? &quot;ax-xcrate&quot; : &quot;ax-unit&quot;}`;
        piece.setAttribute(&quot;aria-hidden&quot;, &quot;true&quot;);
        if (type === &quot;x&quot;) piece.textContent = &quot;x&quot;;
        if (compact) piece.dataset.compact = &quot;true&quot;;
        return piece;
      }

      function appendVisualItem(container, item) {
        if (item.type === &quot;x&quot; || item.type === &quot;unit&quot;) {
          container.appendChild(createPiece(item.type));
          return;
        }

        const tray = document.createElement(&quot;span&quot;);
        tray.className = &quot;ax-tray&quot;;
        const label = document.createElement(&quot;span&quot;);
        label.className = &quot;ax-tray-label text-small&quot;;
        label.textContent = &quot;group&quot;;
        tray.appendChild(label);
        item.items.forEach((child) =&gt; appendVisualItem(tray, child));
        container.appendChild(tray);
      }

      function renderStage(items, label, expression, animate = false) {
        itemsEl.replaceChildren();
        items.forEach((item) =&gt; appendVisualItem(itemsEl, item));
        stageLabelEl.textContent = label;
        expressionEl.textContent = expression;
        stageEl.setAttribute(&quot;aria-label&quot;, `${label}. ${describeInventory(items)}. Expression: ${expression}.`);
        if (animate) {
          itemsEl.classList.remove(&quot;is-animating&quot;);
          void itemsEl.offsetWidth;
          itemsEl.classList.add(&quot;is-animating&quot;);
        } else {
          itemsEl.classList.remove(&quot;is-animating&quot;);
        }
      }

      function renderFlatInventory(container, xCount, unitCount) {
        container.replaceChildren();
        for (let i = 0; i &lt; xCount; i += 1) container.appendChild(createPiece(&quot;x&quot;, true));
        for (let i = 0; i &lt; unitCount; i += 1) container.appendChild(createPiece(&quot;unit&quot;, true));
      }

      function setFeedback(status, message, allowNext = false) {
        feedbackEl.replaceChildren();
        feedbackEl.dataset.state = status;
        const row = document.createElement(&quot;div&quot;);
        row.className = &quot;ax-feedback-row&quot;;
        const copy = document.createElement(&quot;div&quot;);
        copy.className = &quot;ax-feedback-copy&quot;;
        const prefix = document.createElement(&quot;span&quot;);
        prefix.className = &quot;ax-status&quot;;
        prefix.textContent = status === &quot;success&quot; ? &quot;Passed&quot; : &quot;Check&quot;;
        const text = document.createElement(&quot;span&quot;);
        text.textContent = message;
        copy.append(prefix, text);
        row.appendChild(copy);

        if (allowNext) {
          row.appendChild(makeButton(
            state.levelIndex === levels.length - 1 ? &quot;Finish&quot; : &quot;Continue&quot;,
            &quot;btn btn-primary&quot;,
            nextLevel
          ));
        }
        feedbackEl.appendChild(row);
      }

      function clearFeedback() {
        feedbackEl.replaceChildren();
        feedbackEl.removeAttribute(&quot;data-state&quot;);
      }

      function renderProgram(start, program) {
        programEl.replaceChildren();
        if (!program.length) {
          const empty = document.createElement(&quot;span&quot;);
          empty.className = &quot;ax-empty&quot;;
          empty.textContent = &quot;Choose a module below.&quot;;
          programEl.appendChild(empty);
        } else {
          program.forEach((opId, index) =&gt; {
            if (index &gt; 0) {
              const arrow = document.createElement(&quot;span&quot;);
              arrow.className = &quot;ax-arrow&quot;;
              arrow.textContent = &quot;→&quot;;
              arrow.setAttribute(&quot;aria-hidden&quot;, &quot;true&quot;);
              programEl.appendChild(arrow);
            }
            const badge = document.createElement(&quot;span&quot;);
            badge.className = &quot;viz-badge&quot;;
            badge.textContent = operations[opId].label;
            programEl.appendChild(badge);
          });
        }
        programExpressionEl.textContent = expressionFor(start, program);
      }

      function renderBuildControls(level) {
        controlsEl.replaceChildren();
        const tools = document.createElement(&quot;div&quot;);
        tools.className = &quot;ax-tools&quot;;
        level.available.forEach((opId) =&gt; {
          const button = makeButton(operations[opId].label, &quot;btn&quot;, () =&gt; addOperation(opId));
          button.disabled = state.running || state.program.includes(opId) || state.program.length &gt;= level.available.length;
          tools.appendChild(button);
        });

        const actions = document.createElement(&quot;div&quot;);
        actions.className = &quot;ax-actions&quot;;
        const clearButton = makeButton(&quot;Clear program&quot;, &quot;btn btn-ghost&quot;, clearProgram);
        clearButton.disabled = state.running || state.program.length === 0;
        const runButton = makeButton(
          state.running ? &quot;Running…&quot; : state.levelIndex === levels.length - 1 ? &quot;Run hidden tests&quot; : &quot;Run program&quot;,
          &quot;btn btn-primary&quot;,
          runBuild
        );
        runButton.disabled = state.running;
        actions.append(clearButton, runButton);
        controlsEl.append(tools, actions);
      }

      function addOperation(opId) {
        if (state.running) return;
        const level = levels[state.levelIndex];
        if (state.program.includes(opId) || state.program.length &gt;= level.available.length) return;
        state.program.push(opId);
        clearFeedback();
        renderProgram(level.start, state.program);
        renderBuildControls(level);
      }

      function clearProgram() {
        if (state.running) return;
        const level = levels[state.levelIndex];
        state.program = [];
        state.awaitingReflection = false;
        clearFeedback();
        compareEl.hidden = true;
        compareEl.replaceChildren();
        renderProgram(level.start, state.program);
        renderStage(initialItems(level.start), &quot;Input&quot;, expressionFor(level.start, []));
        renderBuildControls(level);
      }

      async function animateProgram(level, program) {
        state.running = true;
        if (level.type === &quot;build&quot; || level.type === &quot;final-build&quot;) renderBuildControls(level);
        let items = initialItems(level.start);
        renderStage(items, &quot;Input&quot;, expressionFor(level.start, []), true);
        await delay(520);
        for (let index = 0; index &lt; program.length; index += 1) {
          const opId = program[index];
          items = applyStructure(items, opId);
          renderStage(items, operations[opId].label, expressionFor(level.start, program.slice(0, index + 1)), true);
          await delay(620);
        }
        state.running = false;
        return items;
      }

      async function runBuild() {
        const level = levels[state.levelIndex];
        if (state.running) return;
        if (state.program.length !== level.available.length) {
          setFeedback(&quot;check&quot;, &quot;The program still has an empty slot. Install each available module once.&quot;);
          return;
        }

        clearFeedback();
        compareEl.hidden = true;
        const finalItems = await animateProgram(level, state.program);
        if (level.type === &quot;final-build&quot;) {
          handleFinalBuild(level, finalItems);
          return;
        }

        renderBuildControls(level);
        if (programsMatch(state.program, level.correct)) {
          state.solved = true;
          setFeedback(&quot;success&quot;, level.success, true);
        } else {
          setFeedback(&quot;check&quot;, level.wrong);
        }
      }

      function renderPlanChoice(level) {
        programEl.replaceChildren();
        const prompt = document.createElement(&quot;span&quot;);
        prompt.className = &quot;ax-empty&quot;;
        prompt.textContent = &quot;Choose a plan to run.&quot;;
        programEl.appendChild(prompt);
        programExpressionEl.textContent = &quot;x&quot;;
        controlsEl.replaceChildren();
        const grid = document.createElement(&quot;div&quot;);
        grid.className = &quot;ax-answer-grid&quot;;
        level.choices.forEach((choice) =&gt; {
          grid.appendChild(makeButton(choice.label, &quot;btn&quot;, () =&gt; runPlanChoice(level, choice)));
        });
        controlsEl.appendChild(grid);
      }

      async function runPlanChoice(level, choice) {
        if (state.running) return;
        clearFeedback();
        state.program = choice.program.slice();
        renderProgram(level.start, state.program);
        const finalItems = await animateProgram(level, state.program);
        renderPlanChoice(level);
        renderProgram(level.start, state.program);
        if (choice.correct) {
          state.solved = true;
          setFeedback(&quot;success&quot;, &quot;The three units were already grouped with x when the tray was duplicated. That scope is shown by 2(x + 3).&quot;, true);
        } else {
          const counts = flattenCounts(finalItems);
          setFeedback(&quot;check&quot;, `This plan duplicated x first and added 3 afterward. Its inventory is ${counts.x} x-crates and ${counts.units} loose units.`);
        }
      }

      function renderEquivalence(level) {
        programEl.replaceChildren();
        const pair = document.createElement(&quot;div&quot;);
        pair.className = &quot;ax-expression-pair viz-row&quot;;
        const left = document.createElement(&quot;code&quot;);
        left.textContent = level.left.expression;
        const versus = document.createElement(&quot;span&quot;);
        versus.className = &quot;text-muted&quot;;
        versus.textContent = &quot;compared with&quot;;
        const right = document.createElement(&quot;code&quot;);
        right.textContent = level.right.expression;
        pair.append(left, versus, right);
        programEl.appendChild(pair);
        programExpressionEl.textContent = &quot;?&quot;;
        controlsEl.replaceChildren();

        if (!state.inspected) {
          const actions = document.createElement(&quot;div&quot;);
          actions.className = &quot;ax-actions&quot;;
          actions.appendChild(makeButton(&quot;Inspect both factories&quot;, &quot;btn btn-primary&quot;, () =&gt; inspectEquivalence(level)));
          controlsEl.appendChild(actions);
          return;
        }

        const grid = document.createElement(&quot;div&quot;);
        grid.className = &quot;ax-answer-grid&quot;;
        grid.append(
          makeButton(&quot;They always agree&quot;, &quot;btn&quot;, () =&gt; answerEquivalence(true)),
          makeButton(&quot;They do not always agree&quot;, &quot;btn&quot;, () =&gt; answerEquivalence(false))
        );
        controlsEl.appendChild(grid);
      }

      function renderTwinComparison(leftExpression, leftCounts, rightExpression, rightCounts, note) {
        compareEl.replaceChildren();
        compareEl.hidden = false;
        const grid = document.createElement(&quot;div&quot;);
        grid.className = &quot;ax-twin-grid&quot;;

        [
          { title: &quot;Factory A&quot;, expression: leftExpression, counts: leftCounts },
          { title: &quot;Factory B&quot;, expression: rightExpression, counts: rightCounts }
        ].forEach((line) =&gt; {
          const section = document.createElement(&quot;section&quot;);
          const heading = document.createElement(&quot;div&quot;);
          heading.className = &quot;ax-line-title&quot;;
          const name = document.createElement(&quot;span&quot;);
          name.textContent = line.title;
          const expression = document.createElement(&quot;code&quot;);
          expression.textContent = line.expression;
          heading.append(name, expression);
          const inventory = document.createElement(&quot;div&quot;);
          inventory.className = &quot;ax-mini-inventory&quot;;
          inventory.setAttribute(&quot;aria-label&quot;, `${line.counts.x} x-crates and ${line.counts.units} units`);
          renderFlatInventory(inventory, line.counts.x, line.counts.units);
          section.append(heading, inventory);
          grid.appendChild(section);
        });

        compareEl.appendChild(grid);
        if (note) {
          const noteEl = document.createElement(&quot;div&quot;);
          noteEl.className = &quot;ax-line-note text-small&quot;;
          noteEl.textContent = note;
          compareEl.appendChild(noteEl);
        }
      }

      function inspectEquivalence(level) {
        state.inspected = true;
        const leftItems = executeStructure(level.start, level.left.program);
        const rightItems = executeStructure(level.start, level.right.program);
        const leftCounts = flattenCounts(leftItems);
        const rightCounts = flattenCounts(rightItems);
        renderStage(leftItems, &quot;Factory A&quot;, level.left.expression, true);
        renderTwinComparison(
          level.left.expression,
          leftCounts,
          level.right.expression,
          rightCounts,
          &quot;After unpacking, both inventories contain the same sealed crates and units.&quot;
        );
        renderEquivalence(level);
      }

      function answerEquivalence(answer) {
        if (answer) {
          state.solved = true;
          setFeedback(&quot;success&quot;, &quot;Different plans can be equivalent. Both always build 2 x-crates and 6 units.&quot;, true);
        } else {
          setFeedback(&quot;check&quot;, &quot;Their instructions look different, but compare the unpacked inventories. What changes when x changes?&quot;);
        }
      }

      function renderCounterexample(level) {
        programEl.replaceChildren();
        const pair = document.createElement(&quot;div&quot;);
        pair.className = &quot;ax-expression-pair viz-row&quot;;
        const left = document.createElement(&quot;code&quot;);
        left.textContent = level.leftExpression;
        const versus = document.createElement(&quot;span&quot;);
        versus.className = &quot;text-muted&quot;;
        versus.textContent = &quot;compared with&quot;;
        const right = document.createElement(&quot;code&quot;);
        right.textContent = level.rightExpression;
        pair.append(left, versus, right);
        programEl.appendChild(pair);
        programExpressionEl.textContent = &quot;Choose x&quot;;
        controlsEl.replaceChildren();
        const grid = document.createElement(&quot;div&quot;);
        grid.className = &quot;ax-answer-grid&quot;;
        level.tests.forEach((value) =&gt; {
          grid.appendChild(makeButton(`Test x = ${value}`, &quot;btn&quot;, () =&gt; runCounterexample(level, value)));
        });
        controlsEl.appendChild(grid);
      }

      function evaluateLeftCounterexample(x) {
        return 2 * (x + 3);
      }

      function evaluateRightCounterexample(x) {
        return 3 * x + 2;
      }

      function renderNumericComparison(level, x, leftValue, rightValue) {
        renderTwinComparison(
          `${level.leftExpression} = ${leftValue}`,
          { x: 0, units: leftValue },
          `${level.rightExpression} = ${rightValue}`,
          { x: 0, units: rightValue },
          `Test input: x = ${x}`
        );
      }

      function runCounterexample(level, x) {
        const leftValue = evaluateLeftCounterexample(x);
        const rightValue = evaluateRightCounterexample(x);
        renderStage(Array.from({ length: leftValue }, () =&gt; ({ type: &quot;unit&quot; })), `Test x = ${x}`, String(leftValue), true);
        renderNumericComparison(level, x, leftValue, rightValue);
        if (leftValue !== rightValue) {
          state.solved = true;
          setFeedback(&quot;success&quot;, `At x = ${x}, the factories produce ${leftValue} and ${rightValue}. One counterexample proves the plans are not equivalent.`, true);
        } else {
          setFeedback(&quot;check&quot;, `They both produce ${leftValue} at x = ${x}. A matching test is evidence, but it cannot prove they will always agree.`);
        }
      }

      function renderHiddenTests(level, program) {
        compareEl.replaceChildren();
        compareEl.hidden = false;
        const wrapper = document.createElement(&quot;div&quot;);
        wrapper.className = &quot;ax-tests table-responsive&quot;;
        const table = document.createElement(&quot;table&quot;);
        table.className = &quot;table table-sm&quot;;
        const thead = document.createElement(&quot;thead&quot;);
        const headerRow = document.createElement(&quot;tr&quot;);
        [&quot;Hidden input&quot;, level.targetExpression, expressionFor(level.start, program), &quot;Result&quot;].forEach((label) =&gt; {
          const th = document.createElement(&quot;th&quot;);
          th.scope = &quot;col&quot;;
          th.textContent = label;
          headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);
        const tbody = document.createElement(&quot;tbody&quot;);
        level.tests.forEach((x) =&gt; {
          const target = 3 * (x + 2);
          const candidate = numericValue(level.start, program, x);
          const row = document.createElement(&quot;tr&quot;);
          [x, target, candidate, target === candidate ? &quot;Match&quot; : &quot;Different&quot;].forEach((value, index) =&gt; {
            const cell = document.createElement(&quot;td&quot;);
            cell.textContent = String(value);
            if (index &gt; 0 &amp;&amp; index &lt; 3) cell.className = &quot;text-end&quot;;
            row.appendChild(cell);
          });
          tbody.appendChild(row);
        });
        table.append(thead, tbody);
        wrapper.appendChild(table);
        compareEl.appendChild(wrapper);
      }

      function handleFinalBuild(level, finalItems) {
        renderBuildControls(level);
        renderHiddenTests(level, state.program);
        if (!programsMatch(state.program, level.correct)) {
          setFeedback(&quot;check&quot;, &quot;The +6 module entered the duplicator, so all six units were copied three times. Clear the program and keep +6 outside the duplicated group.&quot;);
          return;
        }

        const counts = flattenCounts(finalItems);
        renderStage(finalItems, &quot;Candidate plan&quot;, expressionFor(level.start, state.program), true);
        state.awaitingReflection = true;
        renderReflection(level, counts);
        setFeedback(&quot;success&quot;, &quot;All hidden inputs match. Now explain why the match is guaranteed.&quot;);
      }

      function renderReflection(level, counts) {
        controlsEl.replaceChildren();
        const grid = document.createElement(&quot;div&quot;);
        grid.className = &quot;ax-answer-grid&quot;;
        grid.append(
          makeButton(
            `Both plans build ${counts.x} x-crates and ${counts.units} units.`,
            &quot;btn&quot;,
            () =&gt; answerReflection(true)
          ),
          makeButton(
            &quot;They matched the three hidden inputs.&quot;,
            &quot;btn&quot;,
            () =&gt; answerReflection(false)
          ),
          makeButton(
            &quot;Both plans contain two operation modules.&quot;,
            &quot;btn&quot;,
            () =&gt; answerReflection(false)
          )
        );
        controlsEl.appendChild(grid);
      }

      function answerReflection(correct) {
        if (correct) {
          state.solved = true;
          state.awaitingReflection = false;
          setFeedback(&quot;success&quot;, &quot;Exactly. Equivalent expressions build the same inventory for every x, even when their instructions look different.&quot;, true);
        } else {
          setFeedback(&quot;check&quot;, &quot;That is useful evidence, but it does not explain every possible x. Compare what each plan always builds.&quot;);
        }
      }

      function resetLevelState() {
        state.program = [];
        state.running = false;
        state.solved = false;
        state.inspected = false;
        state.awaitingReflection = false;
      }

      function nextLevel() {
        if (!state.solved) return;
        if (state.levelIndex === levels.length - 1) {
          renderComplete();
          return;
        }
        state.levelIndex += 1;
        resetLevelState();
        renderLevel();
      }

      function renderComplete() {
        meterEl.setAttribute(&quot;aria-valuenow&quot;, String(levels.length));
        meterFillEl.style.width = &quot;100%&quot;;
        progressLabelEl.textContent = &quot;Certified&quot;;
        root.querySelector(&quot;#ax-main&quot;).innerHTML = `
          &lt;section class=&quot;ax-complete&quot;&gt;
            &lt;div class=&quot;ax-kicker text-muted&quot;&gt;Certification complete&lt;/div&gt;
            &lt;h2&gt;Different instructions. Same inventory.&lt;/h2&gt;
            &lt;p&gt;Grouping shows what an operation acts on. Equivalent expressions preserve the result for every allowed value of x.&lt;/p&gt;
            &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; id=&quot;ax-replay&quot;&gt;Replay prototype&lt;/button&gt;
          &lt;/section&gt;
        `;
        root.querySelector(&quot;#ax-replay&quot;).addEventListener(&quot;click&quot;, () =&gt; window.location.reload());
      }

      function renderLevel() {
        const level = levels[state.levelIndex];
        progressLabelEl.textContent = `Level ${state.levelIndex + 1} of ${levels.length}`;
        meterEl.setAttribute(&quot;aria-valuenow&quot;, String(state.levelIndex + 1));
        meterFillEl.style.width = `${((state.levelIndex + 1) / levels.length) * 100}%`;
        kickerEl.textContent = level.kicker;
        titleEl.textContent = level.title;
        copyEl.textContent = level.copy;
        clearFeedback();
        compareEl.hidden = true;
        compareEl.replaceChildren();
        renderStage(initialItems(level.start), &quot;Input&quot;, expressionFor(level.start, []));

        if (level.type === &quot;build&quot; || level.type === &quot;final-build&quot;) {
          renderProgram(level.start, state.program);
          renderBuildControls(level);
        }
        if (level.type === &quot;plan-choice&quot;) renderPlanChoice(level);
        if (level.type === &quot;equivalence&quot;) renderEquivalence(level);
        if (level.type === &quot;counterexample&quot;) renderCounterexample(level);
      }

      renderLevel();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
