        visualEl.replaceChildren();
        const orders = document.createElement(&quot;div&quot;);
        orders.className = &quot;sd-orders&quot;;
        if (arrangement === &quot;split&quot;) {
          orders.append(
            createOrder(&quot;Order 1&quot;, 1, priceLabel, 3, true, animate),
            createOrder(&quot;Order 2&quot;, 1, priceLabel, 3, true, animate)
          );
        } else {
          orders.append(
            createOrder(&quot;Order 1&quot;, 2, priceLabel, 3, true, animate),
            createOrder(&quot;Order 2&quot;, 0, priceLabel, 3, false, animate)
          );
        }
        visualEl.appendChild(orders);
        const expression = arrangementExpression(arrangement, priceLabel === &quot;$x&quot; ? &quot;x&quot; : String(numericPrice));
        const total = numericPrice === null ? expression : `$${arrangementTotal(arrangement, numericPrice)}`;
        totalEl.textContent = total;
        readoutLabelEl.textContent = arrangement === &quot;split&quot; ? &quot;Two separate orders&quot; : &quot;One combined order&quot;;
        stageEl.setAttribute(
          &quot;aria-label&quot;,
          `${arrangement === &quot;split&quot; ? &quot;Two separate orders&quot; : &quot;One combined order&quot;}. Two pizzas at ${priceLabel} each. ${arrangement === &quot;split&quot; ? &quot;Two&quot; : &quot;One&quot;} delivery fees of $3. Total ${total}.`
        );
      }

      function renderTickets() {
        visualEl.replaceChildren();
        const orders = document.createElement(&quot;div&quot;);
        orders.className = &quot;sd-orders&quot;;
        for (let group = 0; group &lt; 2; group += 1) {
          const order = document.createElement(&quot;section&quot;);
          order.className = &quot;sd-order is-active&quot;;
          const head = document.createElement(&quot;div&quot;);
          head.className = &quot;sd-order-head&quot;;
          const name = document.createElement(&quot;span&quot;);
          name.className = &quot;sd-order-name text-small&quot;;
          name.textContent = group === 0 ? &quot;Tickets&quot; : &quot;Booking fees&quot;;
          head.appendChild(name);
          const items = document.createElement(&quot;div&quot;);
          items.className = &quot;sd-order-items&quot;;
          for (let index = 0; index &lt; 3; index += 1) {
            items.appendChild(group === 0 ? ticketVisual(&quot;$x&quot;) : feeVisual(2, &quot;Fee&quot;));
          }
          order.append(head, items);
          orders.appendChild(order);
        }
        visualEl.appendChild(orders);
        readoutLabelEl.textContent = &quot;Three tickets with three fees&quot;;
        totalEl.textContent = &quot;3(x + 2)&quot;;
        stageEl.setAttribute(&quot;aria-label&quot;, &quot;Three tickets at x dollars each and three booking fees of $2 each.&quot;);
      }

      function setFeedback(status, message, allowNext = false) {
        feedbackEl.replaceChildren();
        const row = document.createElement(&quot;div&quot;);
        row.className = &quot;sd-feedback-row&quot;;
        const copy = document.createElement(&quot;div&quot;);
        copy.className = &quot;sd-feedback-copy&quot;;
        const prefix = document.createElement(&quot;span&quot;);
        prefix.className = &quot;sd-status&quot;;
        prefix.textContent = status === &quot;success&quot; ? &quot;Passed&quot; : &quot;Check&quot;;
        const text = document.createElement(&quot;span&quot;);
        text.textContent = message;
        copy.append(prefix, text);
        row.appendChild(copy);
        if (allowNext) {
          row.appendChild(makeButton(state.levelIndex === levels.length - 1 ? &quot;Finish&quot; : &quot;Continue&quot;, &quot;btn btn-primary&quot;, nextLevel));
        }
        feedbackEl.appendChild(row);
      }

      function clearFeedback() {
        feedbackEl.replaceChildren();
      }

      function renderProgramText(text, expression = &quot;&quot;) {
        programEl.replaceChildren();
        const prompt = document.createElement(&quot;span&quot;);
        prompt.className = text ? &quot;&quot; : &quot;sd-empty&quot;;
        prompt.textContent = text || &quot;Choose below.&quot;;
        programEl.appendChild(prompt);
        programExpressionEl.textContent = expression;
      }

      function renderExplore(level) {
        renderOrders(state.arrangement, `$${level.price}`, level.price);
        renderProgramText(&quot;Try both checkout arrangements.&quot;, arrangementExpression(state.arrangement, String(level.price)));
        controlsEl.replaceChildren();
        const controls = document.createElement(&quot;div&quot;);
        controls.className = &quot;sd-controls&quot;;
        controls.append(
          makeButton(&quot;Put both in one order&quot;, &quot;btn&quot;, () =&gt; chooseArrangement(&quot;combined&quot;)),
          makeButton(&quot;Split into two orders&quot;, &quot;btn&quot;, () =&gt; chooseArrangement(&quot;split&quot;))
        );
        controlsEl.appendChild(controls);
        if (state.tried.size === 2) {
          const answers = document.createElement(&quot;div&quot;);
          answers.className = &quot;sd-answer-grid&quot;;
          answers.append(
            makeButton(&quot;One combined order costs less&quot;, &quot;btn&quot;, () =&gt; answerExplore(true)),
            makeButton(&quot;Two separate orders cost less&quot;, &quot;btn&quot;, () =&gt; answerExplore(false))
          );
          controlsEl.appendChild(answers);
        }
      }

      function chooseArrangement(arrangement) {
        const level = levels[state.levelIndex];
        state.arrangement = arrangement;
        state.tried.add(arrangement);
        clearFeedback();
        renderExplore(level);
        renderOrders(arrangement, `$${level.price}`, level.price, true);
        if (state.tried.size &lt; 2) {
          setFeedback(&quot;check&quot;, `This checkout costs $${arrangementTotal(arrangement, level.price)}. Test the other arrangement before deciding.`);
        }
      }

      function answerExplore(correct) {
        if (correct) {
          state.solved = true;
          setFeedback(&quot;success&quot;, &quot;Combining the pizzas removes one $3 delivery fee: $19 instead of $22.&quot;, true);
        } else {
          setFeedback(&quot;check&quot;, &quot;The pizzas cost the same either way. Compare the number of active delivery fees.&quot;);
        }
      }

      function renderChoiceLevel(level) {
        renderOrders(level.arrangement, &quot;$x&quot;);
        renderProgramText(&quot;Choose the expression that matches the checkout.&quot;, &quot;?&quot;);
        controlsEl.replaceChildren();
        const answers = document.createElement(&quot;div&quot;);
        answers.className = &quot;sd-answer-grid&quot;;
        level.choices.forEach((choice) =&gt; {
          answers.appendChild(makeButton(choice.label, &quot;btn&quot;, () =&gt; answerChoice(level, choice)));
        });
        controlsEl.appendChild(answers);
      }

      function answerChoice(level, choice) {
        programExpressionEl.textContent = choice.label;
        if (choice.correct) {
          state.solved = true;
          setFeedback(&quot;success&quot;, level.success, true);
        } else {
          setFeedback(&quot;check&quot;, level.wrong);
        }
      }

      function renderReceiptLevel(level) {
        renderOrders(&quot;split&quot;, &quot;$x&quot;);
        compareEl.hidden = false;
        compareEl.replaceChildren();
        const totals = document.createElement(&quot;div&quot;);
        totals.className = &quot;sd-totals&quot;;
        [&quot;Receipt 1: x + 3&quot;, &quot;Receipt 2: x + 3&quot;].forEach((text) =&gt; {
          const line = document.createElement(&quot;div&quot;);
          line.className = &quot;sd-total-line&quot;;
          const label = document.createElement(&quot;span&quot;);
          label.textContent = text.split(&quot;:&quot;)[0];
          const code = document.createElement(&quot;code&quot;);
          code.textContent = text.split(&quot;: &quot;)[1];
          line.append(label, code);
          totals.appendChild(line);
        });
        compareEl.appendChild(totals);
        renderProgramText(&quot;Combine like costs without removing anything.&quot;, &quot;(x + 3) + (x + 3)&quot;);
        controlsEl.replaceChildren();
        const answers = document.createElement(&quot;div&quot;);
        answers.className = &quot;sd-answer-grid&quot;;
        level.choices.forEach((choice) =&gt; {
          answers.appendChild(makeButton(choice.label, &quot;btn&quot;, () =&gt; answerReceipt(choice)));
        });
        controlsEl.appendChild(answers);
      }

      function answerReceipt(choice) {
        programExpressionEl.textContent = choice.label;
        if (choice.correct) {
          state.solved = true;
          const note = document.createElement(&quot;div&quot;);
          note.className = &quot;sd-note text-small&quot;;
          note.textContent = &quot;Two pizza prices become 2x. Two $3 delivery fees become $6.&quot;;
          compareEl.appendChild(note);
          setFeedback(&quot;success&quot;, &quot;Nothing changed in the purchase: 2(x + 3) and 2x + 6 name the same total for every x.&quot;, true);
        } else {
          setFeedback(&quot;check&quot;, &quot;Open both receipts: how many pizza prices and how many $3 fees are listed altogether?&quot;);
        }
      }

      function renderSliderLevel() {
        renderOrders(&quot;combined&quot;, `$${state.price}`, state.price);
        renderPriceComparison(state.price);
        renderProgramText(&quot;Move the price, then identify the invariant.&quot;, `x = ${state.price}`);
        controlsEl.replaceChildren();
        const rangeWrap = document.createElement(&quot;div&quot;);
        rangeWrap.className = &quot;sd-range-wrap&quot;;
        const label = document.createElement(&quot;label&quot;);
        label.className = &quot;form-label&quot;;
        label.htmlFor = &quot;sd-price-range&quot;;
        label.textContent = `Pizza price: $${state.price}`;
        const range = document.createElement(&quot;input&quot;);
        range.className = &quot;form-range&quot;;
        range.id = &quot;sd-price-range&quot;;
        range.type = &quot;range&quot;;
        range.min = &quot;4&quot;;
        range.max = &quot;14&quot;;
        range.step = &quot;1&quot;;
        range.value = String(state.price);
        range.addEventListener(&quot;input&quot;, () =&gt; {
          state.price = Number(range.value);
          label.textContent = `Pizza price: $${state.price}`;
          programExpressionEl.textContent = `x = ${state.price}`;
          renderOrders(&quot;combined&quot;, `$${state.price}`, state.price, true);
          renderPriceComparison(state.price);
        });
        rangeWrap.append(label, range);
        const answers = document.createElement(&quot;div&quot;);
        answers.className = &quot;sd-answer-grid&quot;;
        answers.append(
          makeButton(&quot;Separate orders always cost $3 more&quot;, &quot;btn&quot;, () =&gt; answerSlider(true)),
          makeButton(&quot;The difference changes with x&quot;, &quot;btn&quot;, () =&gt; answerSlider(false)),
          makeButton(&quot;The totals eventually become equal&quot;, &quot;btn&quot;, () =&gt; answerSlider(false))
        );
        controlsEl.append(rangeWrap, answers);
      }

      function renderPriceComparison(price) {
        compareEl.hidden = false;
        compareEl.replaceChildren();
        const totals = document.createElement(&quot;div&quot;);
        totals.className = &quot;sd-totals&quot;;
        [
          { label: &quot;Two separate orders&quot;, value: 2 * (price + 3), expression: `2(${price} + 3)` },
          { label: &quot;One combined order&quot;, value: 2 * price + 3, expression: `2 × ${price} + 3` }
        ].forEach((entry) =&gt; {
          const line = document.createElement(&quot;div&quot;);
          line.className = &quot;sd-total-line&quot;;
          const label = document.createElement(&quot;span&quot;);
          label.textContent = entry.label;
          const code = document.createElement(&quot;code&quot;);
          code.textContent = `${entry.expression} = $${entry.value}`;
          line.append(label, code);
          totals.appendChild(line);
        });
        compareEl.appendChild(totals);
      }

      function answerSlider(correct) {
        if (correct) {
          state.solved = true;
          setFeedback(&quot;success&quot;, &quot;Changing x changes both totals equally. The extra delivery fee keeps the separate orders exactly $3 higher.&quot;, true);
        } else {
          setFeedback(&quot;check&quot;, &quot;Move the price to both ends of the slider and subtract the combined total from the separate total.&quot;);
        }
      }

      function renderCounterexample(level) {
        renderOrders(&quot;split&quot;, &quot;$x&quot;);
        renderProgramText(&quot;Choose a new value for x.&quot;, &quot;2(x + 3) ? 3x + 2&quot;);
        controlsEl.replaceChildren();
        const answers = document.createElement(&quot;div&quot;);
        answers.className = &quot;sd-answer-grid&quot;;
        level.tests.forEach((x) =&gt; {
          answers.appendChild(makeButton(`Test x = ${x}`, &quot;btn&quot;, () =&gt; answerCounterexample(x)));
        });
        controlsEl.appendChild(answers);
      }

      function answerCounterexample(x) {
        const left = 2 * (x + 3);
        const right = 3 * x + 2;
        compareEl.hidden = false;
        compareEl.replaceChildren();
        const totals = document.createElement(&quot;div&quot;);
        totals.className = &quot;sd-totals&quot;;
        [
          { label: &quot;Plan A&quot;, expression: `2(${x} + 3) = ${left}` },
          { label: &quot;Plan B&quot;, expression: `3 × ${x} + 2 = ${right}` }
        ].forEach((entry) =&gt; {
          const line = document.createElement(&quot;div&quot;);
          line.className = &quot;sd-total-line&quot;;
          const label = document.createElement(&quot;span&quot;);
          label.textContent = entry.label;
          const code = document.createElement(&quot;code&quot;);
          code.textContent = entry.expression;
          line.append(label, code);
          totals.appendChild(line);
        });
        compareEl.appendChild(totals);
        programExpressionEl.textContent = `x = ${x}`;
        if (left !== right) {
          state.solved = true;
          setFeedback(&quot;success&quot;, `At x = ${x}, the totals are ${left} and ${right}. One counterexample proves the expressions are not equivalent.`, true);
        } else {
          setFeedback(&quot;check&quot;, `They both equal ${left} when x = ${x}. A matching example cannot prove they will agree at every price.`);
        }
      }

      function renderTransfer(level) {
        renderTickets();
        renderProgramText(&quot;Choose two equivalent expressions.&quot;, &quot;?&quot;);
        controlsEl.replaceChildren();
        const answers = document.createElement(&quot;div&quot;);
        answers.className = &quot;sd-answer-grid&quot;;
        level.choices.forEach((choice) =&gt; {
          answers.appendChild(makeButton(choice.label, &quot;btn&quot;, () =&gt; answerTransfer(level, choice)));
        });
        controlsEl.appendChild(answers);
      }

      function answerTransfer(level, choice) {
        programExpressionEl.textContent = choice.label;
        if (!choice.correct) {
          setFeedback(&quot;check&quot;, &quot;There are three ticket prices and three separate $2 fees. Count both kinds of cost.&quot;);
          return;
        }
        renderTransferTests(level);
        state.awaitingReflection = true;
        renderTransferReflection();
        setFeedback(&quot;success&quot;, &quot;The expressions pass every test shown. Now explain why the match is guaranteed.&quot;);
      }

      function renderTransferTests(level) {
        compareEl.hidden = false;
        compareEl.replaceChildren();
        const wrapper = document.createElement(&quot;div&quot;);
        wrapper.className = &quot;sd-tests table-responsive&quot;;
        const table = document.createElement(&quot;table&quot;);
        table.className = &quot;table table-sm&quot;;
        const head = document.createElement(&quot;thead&quot;);
        const headerRow = document.createElement(&quot;tr&quot;);
        [&quot;Ticket price x&quot;, &quot;3(x + 2)&quot;, &quot;3x + 6&quot;, &quot;Result&quot;].forEach((label) =&gt; {
          const th = document.createElement(&quot;th&quot;);
          th.scope = &quot;col&quot;;
          th.textContent = label;
          headerRow.appendChild(th);
        });
        head.appendChild(headerRow);
        const body = document.createElement(&quot;tbody&quot;);
        level.tests.forEach((x) =&gt; {
          const row = document.createElement(&quot;tr&quot;);
          const left = 3 * (x + 2);
          const right = 3 * x + 6;
          [x, left, right, &quot;Match&quot;].forEach((value) =&gt; {
            const cell = document.createElement(&quot;td&quot;);
            cell.textContent = String(value);
            row.appendChild(cell);
          });
          body.appendChild(row);
        });
        table.append(head, body);
        wrapper.appendChild(table);
        compareEl.appendChild(wrapper);
      }

      function renderTransferReflection() {
        controlsEl.replaceChildren();
        const answers = document.createElement(&quot;div&quot;);
        answers.className = &quot;sd-answer-grid&quot;;
        answers.append(
          makeButton(&quot;Both totals contain 3 ticket prices and three $2 fees.&quot;, &quot;btn&quot;, () =&gt; answerReflection(true)),
          makeButton(&quot;Both expressions contain a 3.&quot;, &quot;btn&quot;, () =&gt; answerReflection(false)),
          makeButton(&quot;They matched the three test prices.&quot;, &quot;btn&quot;, () =&gt; answerReflection(false))
        );
        controlsEl.appendChild(answers);
      }

      function answerReflection(correct) {
        if (correct) {
          state.solved = true;
          state.awaitingReflection = false;
          setFeedback(&quot;success&quot;, &quot;Exactly. Equivalent expressions describe the same costs for every possible ticket price.&quot;, true);
        } else {
          setFeedback(&quot;check&quot;, &quot;That is evidence, but not a structural explanation. Identify every cost that will always appear.&quot;);
        }
      }

      function resetLevelState() {
        state.solved = false;
        state.tried = new Set();
        state.arrangement = &quot;combined&quot;;
        state.price = 8;
        state.awaitingReflection = false;
      }

      function nextLevel() {
        if (!state.solved) return;
        if (state.levelIndex === levels.length - 1) {
          renderComplete();
          return;
        }
        state.levelIndex += 1;
        resetLevelState();
        renderLevel();
      }

      function renderComplete() {
        progressLabelEl.textContent = &quot;Complete&quot;;
        meterEl.setAttribute(&quot;aria-valuenow&quot;, String(levels.length));
        meterFillEl.style.width = &quot;100%&quot;;
        root.querySelector(&quot;#sd-main&quot;).innerHTML = `
          &lt;section class=&quot;sd-complete&quot;&gt;
            &lt;div class=&quot;sd-kicker text-muted&quot;&gt;Decision explained&lt;/div&gt;
            &lt;h2&gt;Grouping tells you which costs repeat.&lt;/h2&gt;
            &lt;p&gt;Equivalent expressions may organize a checkout differently, but they preserve every cost for every allowed value of x.&lt;/p&gt;
            &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; id=&quot;sd-replay&quot;&gt;Replay prototype&lt;/button&gt;
          &lt;/section&gt;
        `;
        root.querySelector(&quot;#sd-replay&quot;).addEventListener(&quot;click&quot;, () =&gt; window.location.reload());
      }

      function renderLevel() {
        const level = levels[state.levelIndex];
        progressLabelEl.textContent = `Level ${state.levelIndex + 1} of ${levels.length}`;
        meterEl.setAttribute(&quot;aria-valuenow&quot;, String(state.levelIndex + 1));
        meterFillEl.style.width = `${((state.levelIndex + 1) / levels.length) * 100}%`;
        kickerEl.textContent = level.kicker;
        titleEl.textContent = level.title;
        copyEl.textContent = level.copy;
        compareEl.hidden = true;
        compareEl.replaceChildren();
        clearFeedback();

        if (level.type === &quot;explore&quot;) renderExplore(level);
        if (level.type === &quot;expression&quot;) renderChoiceLevel(level);
        if (level.type === &quot;receipt&quot;) renderReceiptLevel(level);
        if (level.type === &quot;slider&quot;) renderSliderLevel(level);
        if (level.type === &quot;counterexample&quot;) renderCounterexample(level);
        if (level.type === &quot;transfer&quot;) renderTransfer(level);
      }

      renderLevel();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
